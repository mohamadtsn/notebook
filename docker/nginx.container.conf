# Config for the opt-in frontend-serve container (compose profile "serve").
# Static only — no API proxy: in this mode the browser talks to the backend
# directly on BACKEND_PORT via VITE_API_URL, and CORS_ORIGIN covers it.
# Production uses the host's nginx instead; see ../deploy/nginx.conf.

server {
    listen 80;
    root /var/www/html/dist;
    index index.html;

    client_max_body_size 10m;

    # Gzip compression for high-performance asset delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, no-cache";
    }

    # A stale sw.js means the app can never learn a new version exists. Must come
    # before the static-asset rule, which would otherwise pin it for 6 months.
    location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "public, no-cache";
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
