services:
  server:
    build: ./server
    restart: unless-stopped
    # Runs as the host user so the bind-mounted ./data stays writable and the files
    # it creates are owned by you, not root. UID/GID come from .env — the shell
    # never exports them, so without .env this silently falls back to 1000:1000 and
    # SQLite dies with "unable to open database file" on any other account.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # Loopback only: the host's nginx proxies /api/ to it. Binding 0.0.0.0 would
      # expose the API raw on the internet, past every header nginx sets.
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    environment:
      # Required — the server refuses to boot without it. See .env.example.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    volumes:
      # Plain host directory, deliberately not a docker volume: the SQLite file is
      # a real file you can see, back up, and copy. No docker command can drop it.
      - ./data:/data

  frontend-build:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend-build
    # Same reason as the server: without this the output is owned by root and the
    # host's nginx may not be able to read it.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # Baked into the bundle at build time. Set it to /api in production so the
      # browser calls the same origin through nginx.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3236}
    volumes:
      # Map the build output to the host, so Nginx can serve it
      - ./dist:/app/dist

  frontend-serve:
    # Opt-in only: in production the host's own nginx serves ./dist directly, so a
    # plain `docker compose up -d` must not start a second nginx on port 80.
    # Naming the service explicitly activates the profile:
    #   docker compose up -d --build frontend-serve
    profiles: ["serve"]
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend-serve
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - frontend-build