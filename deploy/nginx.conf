# Production config for the HOST's nginx — not the container.
# The frontend-serve container is opt-in (compose profile "serve") and carries its
# own config in docker/nginx.container.conf; in production the host serves ./dist
# directly and there is no second nginx.
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/notebook
#   sudo ln -s /etc/nginx/sites-available/notebook /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Deploy = rebuild dist, no reload needed (static files):
#   docker compose run --rm --build frontend-build
# The --build is load-bearing: without it the old image rebuilds the old source.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com; # Replace with your actual domain

    # Vite build output, bind-mounted out of the frontend-build container.
    # Replace with the absolute path to this repo's ./dist on the server.
    root /srv/notebook/dist;
    index index.html;

    # The API returns JSON; notes can get large.
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # SPA fallback: no router in this app, but a deep link or a refresh still has to
    # land on index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, no-cache";
    }

    # The PWA entry points must never be cached: a stale sw.js means the app can
    # never learn a new version exists. Must come before the static-asset rule,
    # which would otherwise match sw.js and pin it for 6 months.
    location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "public, no-cache";
    }

    # Everything else Vite emits is content-hashed, so it can be cached forever.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Backend. Fastify mounts /auth/*, /sync/* and /health at the root, so the
    # trailing slash on proxy_pass is load-bearing: it strips the /api prefix.
    # Pair with VITE_API_URL=/api so the browser calls the same origin.
    # Port is BACKEND_PORT from .env, published on loopback only.
    location /api/ {
        proxy_pass http://127.0.0.1:3236/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}