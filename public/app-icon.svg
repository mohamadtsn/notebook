<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Calm Persian Teal chassis gradient (accent #0E7490) -->
    <linearGradient id="bg-teal" x1="440" y1="40" x2="72" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1186A6"/>
      <stop offset="0.52" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#084C61"/>
    </linearGradient>

    <!-- Warm paper surface gradient (surface #FFFFFF to canvas #F5F5F0) -->
    <linearGradient id="paper-main" x1="360" y1="104" x2="148" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F5F0"/>
    </linearGradient>

    <!-- RTL Spine gradient (inline-start right binding) -->
    <linearGradient id="spine-dark" x1="376" y1="104" x2="326" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#073B4C"/>
      <stop offset="1" stop-color="#052935"/>
    </linearGradient>

    <!-- Soft ambient elevation shadow (shadow-e3) -->
    <filter id="book-shadow" x="96" y="80" width="320" height="368" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04222C" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#04222C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Outer App Icon Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bg-teal)"/>
  <!-- Glass edge inner highlight (glass-edge) -->
  <rect x="2" y="2" width="508" height="508" rx="114" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>

  <!-- Subtle architectural grid rings in background -->
  <circle cx="256" cy="256" r="196" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5"/>

  <g filter="url(#book-shadow)">
    <!-- Secondary stacked sheet peeking on the left (inline-end) for paper depth -->
    <rect x="132" y="118" width="232" height="276" rx="28" fill="#DCE8EB" opacity="0.72"/>

    <!-- Sand bookmark ribbon (label-sand #D9C89E) tucking out from bottom-left -->
    <path d="M182 376H218V424L200 411L182 424V376Z" fill="#D9C89E"/>

    <!-- Main Warm Paper Notebook Body (top-left corner chamfered for page fold) -->
    <path
      d="M196 104H346C362.569 104 376 117.431 376 134V374C376 390.569 362.569 404 346 404H174C157.431 404 144 390.569 144 374V156L196 104Z"
      fill="url(#paper-main)"
    />

    <!-- Top-left (inline-end) folded page corner -->
    <path
      d="M196 104V140C196 148.837 188.837 156 180 156H144L196 104Z"
      fill="#DFE8EA"
    />

    <!-- Right-hand (inline-start) RTL Persian Spine -->
    <path
      d="M328 104H346C362.569 104 376 117.431 376 134V374C376 390.569 362.569 404 346 404H328V104Z"
      fill="url(#spine-dark)"
    />
    <!-- Subtle spine crease hairline -->
    <line x1="328" y1="104" x2="328" y2="404" stroke="#0E7490" stroke-opacity="0.22" stroke-width="2"/>

    <!-- Three RTL binding stitches on the right spine -->
    <rect x="345" y="152" width="14" height="24" rx="7" fill="#F5F5F0" fill-opacity="0.92"/>
    <rect x="345" y="242" width="14" height="24" rx="7" fill="#F5F5F0" fill-opacity="0.92"/>
    <rect x="345" y="332" width="14" height="24" rx="7" fill="#F5F5F0" fill-opacity="0.92"/>

    <!-- Right-aligned (RTL) Persian typography lines inside the page -->
    <!-- Title bar in primary accent (#0E7490) with sand label dot -->
    <circle cx="298" cy="176" r="7" fill="#D9C89E"/>
    <rect x="206" y="169" width="76" height="14" rx="7" fill="#0E7490"/>

    <!-- Body lines aligned to right margin (x = 305) flowing leftward -->
    <rect x="177" y="218" width="128" height="12" rx="6" fill="#0F172A" fill-opacity="0.28"/>
    <rect x="193" y="254" width="112" height="12" rx="6" fill="#0F172A" fill-opacity="0.28"/>
    <rect x="225" y="290" width="80" height="12" rx="6" fill="#0F172A" fill-opacity="0.20"/>
  </g>
</svg>
